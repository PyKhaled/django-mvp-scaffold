[project]
name = "product"
version = "0.1.0"
description = "product"
requires-python = ">=3.12"

[dependency-groups]
base = [
    "Django==5.2.16",
    "django-helpdesk==2.3.0",
    "django-hijack==3.7.4",
    "django-maintenance-mode==0.22.0",
    "django-model-utils==5.0.0",
    "django-notifications-hq==1.8.3",
    "django-simple-history==3.10.1",
    "jsonfield==3.1.0",
    "openai==2.43.0",
    "pillow==12.3.0",
    "pydantic==2.13.4",
    "setuptools<81",
    "swapper==1.4.0",
]

dev = [
    { include-group = "base" },
    "django-debug-toolbar==6.1.0",
    "factory-boy==3.3.3",
    "faker==37.12.0",
]

production = [
    { include-group = "base" },
    "django-storages[google]==1.14.4",
    "gunicorn==23.0.0",
    "psycopg[binary]==3.2.13",
]