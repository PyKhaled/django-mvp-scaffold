name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev --group production
      - name: Verify dependencies
        run: |
          python -m pip check
          python -m pip_audit --progress-spinner off
          ruff check .
      - name: Run Django checks and tests
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
          python manage.py collectstatic --noinput --dry-run
      - name: Validate production settings
        env:
          DJANGO_ENV: production
          SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-123456789
          ALLOWED_HOSTS: example.com
          POSTGRES_DB: product
          POSTGRES_USER: product
          POSTGRES_PASSWORD: ci-only
          GS_BUCKET_NAME: ci-assets
          EMAIL_HOST: smtp.example.com
          DEFAULT_FROM_EMAIL: support@example.com
          SITE_DOMAIN: example.com
          REDIS_URL: redis://redis:6379
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy
