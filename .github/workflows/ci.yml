name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DJANGO_ENV: development
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev --group production --group docs
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput
      - run: python manage.py collectstatic --noinput --dry-run
      - run: python -m pip check
      - run: mkdocs build --strict

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev --group production --group docs
      - run: python -m pip_audit --progress-spinner off

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        target: [dev, production]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build --target "$TARGET" -t scaffold:ci .
        env:
          TARGET: ${{ matrix.target }}
      - if: matrix.target == 'dev'
        run: docker run --rm scaffold:ci python manage.py check
      - if: matrix.target == 'dev'
        run: docker run --rm scaffold:ci python manage.py test --noinput
