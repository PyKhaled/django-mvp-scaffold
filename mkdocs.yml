site_name: Django MVP Scaffold
site_description: Engineering, API, architecture and operational documentation
# These are adoption documents, rather than theme templates.
exclude_docs: |
  !/templates/

theme:
  name: material

extra_css:
  - https://unpkg.com/swagger-ui-dist@5.33.1/swagger-ui.css
  - assets/css/swagger.css

extra_javascript:
  - https://unpkg.com/swagger-ui-dist@5.33.1/swagger-ui-bundle.js
  - assets/js/swagger.js

nav:
  - Home: README.md

  - Getting Started:
      - Overview: getting-started/index.md

  - Architecture:
      - Overview: architecture/index.md
      - System Overview: architecture/system-overview.md

  - API:
      - Helpdesk API Reference: api/index.md

  - Runbooks:
      - Overview: runbooks/index.md
      - Local Development: runbooks/local-development.md
      - Deployment and Rollback: runbooks/deployment.md
      - Backup and Restore: runbooks/backup-restore.md
      - Maintenance: runbooks/maintenance.md
      - Support and Email: runbooks/support-email.md
      - Incident Response: runbooks/incident-response.md

  - Guides:
      - Development: guides/development.md
      - Customization: guides/customization.md
      - Releases: guides/releases.md

  - Security:
      - Overview: security/index.md
      - Vulnerability Management: security/vulnerability-management.md

  - Configuration: configuration.md
  - Known Issues: known-issues.md
  - Templates:
      - Overview: templates/index.md
      - Architecture Decision: templates/architecture-decision.md
      - Deployment Planning: templates/deployment-planning.md
