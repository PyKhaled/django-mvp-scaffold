<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Maintenance · CreativeBatch</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fb; color: #182433; }
    main { width: min(36rem, calc(100% - 3rem)); text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 4rem; height: 4rem; border-radius: 1rem; background: #206bc4; color: white; font-size: 2rem; }
    h1 { margin: 1.5rem 0 .75rem; font-size: clamp(2rem, 6vw, 3rem); }
    p { color: #667382; font-size: 1.1rem; line-height: 1.6; }
    @media (prefers-color-scheme: dark) {
      body { background: #151f2c; color: #f6f8fb; }
      p { color: #aeb8c4; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>We’ll be right back.</h1>
    <p>CreativeBatch is undergoing scheduled maintenance. Please try again in a few minutes.</p>
  </main>
</body>
</html>
