{% load i18n hijack %}

{% if hijack_user %}
  <!-- Hijack Warning Banner -->
  <div class="hijack-banner py-2" style="background-color: #fff3cd; border-bottom: 1px solid #ffc107;">
    <div class="container-xl">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon text-warning" width="20" height="20" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
            <path d="M12 7v5" />
            <path d="M12 16v.01" />
          </svg>
          <span class="text-sm">
            <strong>{% trans "Impersonating:" %}</strong>
            <code style="background-color: rgba(0,0,0,0.05); padding: 0.25rem 0.5rem; border-radius: 0.25rem;">
              {{ hijack_user.username }}
            </code>
            {% if hijack_user.get_full_name %}
              <span class="text-muted">({{ hijack_user.get_full_name }})</span>
            {% endif %}
          </span>
        </div>
        <div>
          <a href="{% url 'hijack:release_hijack' %}" class="btn btn-sm btn-warning">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="18" height="18" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
              <path d="M9 6l-6 6l6 6" />
              <path d="M15 12h-12" />
            </svg>
            {% trans "Release" %}
          </a>
        </div>
      </div>
    </div>
  </div>
{% endif %}
