{% load i18n %}
<!-- Help Desk Error Template -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>{% trans 'Error' %}</title>
  {% include 'layout/tabler_head.html' %}
</head>
<body class="layout-fluid">
  <div class="page">
    <div class="page-wrapper">
      <div class="page-body">
        <div class="container-xl d-flex flex-column justify-content-center py-6">
          <div class="empty">
            <div class="empty-header">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="48" height="48" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M12 8v4" /><path d="M12 16v.01" /></path></svg>
            </div>
            <p class="empty-title">{% trans 'Oops!' %}</p>
            <p class="empty-subtitle text-muted">
              {% trans 'We encountered an error processing your request.' %}
            </p>
            <div class="empty-action">
              <a href="/helpdesk/" class="btn btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 6l-6 6l6 6" /><path d="M15 12h-12" /></path></svg>
                {% trans 'Go back to support' %}
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  {% include 'layout/tabler_scripts.html' %}
</body>
</html>
